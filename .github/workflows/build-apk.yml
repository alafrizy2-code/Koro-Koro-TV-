name: Build & Release Koro Koro TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env from .env.example if missing
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK (Unsigned)
        run: gradle :app:assembleRelease -x lintVitalRelease || true

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/koro-koro-tv-debug.apk
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk release-apks/koro-koro-tv-release.apk
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koro-koro-tv-apks
          path: release-apks/*.apk

      - name: Publish Direct Download Links via GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Koro Koro TV - Latest APK
          body: |
            Download langsung APK **Koro Koro TV** untuk Android TV Box:
            - `koro-koro-tv-debug.apk` (Siap pasang langsung)
            - `koro-koro-tv-release.apk` (Versi release)
          files: release-apks/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
