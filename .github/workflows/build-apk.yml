name: Build Koro Koro TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env from .env.example if missing
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK (Unsigned)
        run: gradle :app:assembleRelease -x lintVitalRelease || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: koro-koro-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koro-koro-tv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
